<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Insert title here</title>

<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
	rel="stylesheet"
	integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
	crossorigin="anonymous">

</head>
<body>
 
 <div class="container">
	<h1>Bienvenido a la biblioteca</h1>
	</div>
	
 <div class="container">
	<h2>Introduce tus datos</h2>
	</div>
	<script
		src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
		integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
		crossorigin="anonymous"></script>

	<form action="">

		<div class="container">
			<div class="form-group">

				<label for="dni"> DNI: </label> <input type="text" id="dni"
					class="form-control" name="dni" placeholder="introduce tu DNI" />
				<small class="form-text"> (Incluye tambien las letras)</small>
			</div>

			<div class="form-group">
				<label for="nombre">Nombre:</label> <input type="text" id="nombre"
					class="form-control" name="nombre"
					placeholder="introduce el nombre" /> <small class="form-text">
					(Nombres completos)</small>
			</div>


			<div class="form-group">
				<label for="apellidos">Apellidos:</label> <input type="text"
					id="apellidos" class="form-control" name="apellidos"
					placeholder="introduce el apellido" /> <small class="form-text">
					(Apellidos completos)</small>
			</div>
			<input type="hidden" name="comando" value="salvarsocio"/>
			<input type="submit" class="btn btn-secondary" name="Guardar" />
		</div>

	</form>


</body>
</html>
