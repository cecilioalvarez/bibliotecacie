<!DOCTYPE html>
<html lang="en">
<head>
<link rel="stylesheet" href="estilo.css">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bootstrap demo</title>
<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
	rel="stylesheet"
	integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
	crossorigin="anonymous">
<head>
<body>
	<h1>Formulario para Socios</h1>
	<script
		src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
		integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
		crossorigin="anonymous"></script>
	<form>
		<div class="container">
			<div class="form-group">

				<label for="nombre">Nombre:</label> <input type="text" id="nombre"
					class="form-control" name="nombre"
					placeholder="Introduce el nombre" /> <small class="form-text">
					El campo de nombre</small>
			</div>
			<div class="form-group">
				<label for="apellidos">Apellidos:</label> <input type="text"
					id="apellidos" class="form-control" name="apellidos"
					placeholder="Introduce el apellido" /> <small class="form-text">
					El campo de apellido</small>
			</div>
			<div class="form-group">
				<label for="dni">Dni:</label> <input type="text" id="dni"
					class="form-control" name="dni" placeholder="Introduce el dni" />
				<small class="form-text"> El campo de dni</small>
			</div>
			<input type="hidden" name="comando" value="salvarsocio" /> <input
				type="submit" value="Añadir" />
		</div>
	</form>

</body>
</html>
