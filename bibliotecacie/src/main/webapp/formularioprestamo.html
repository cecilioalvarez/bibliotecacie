<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Insert title here</title>

<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
	rel="stylesheet"
	integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
	crossorigin="anonymous">
</head>
<body>
	<h1>Formulario prestamo</h1>
	<script
		src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
		integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
		crossorigin="anonymous"></script>


	<form action="">
		<div class="container">
			<div class="form-group">
				<label for="identificador">Identificador:</label> <input
					type="number" id="identificador" class="form-control"
					name="identificador" placeholder="Introduce el identificador" /> <small
					class="form-text">El campo del Identificador</small>
			</div>
			<div class="form-group">
				<label for="fecha">Fecha :</label> <input type="date" id="fecha"
					class="form-control" name="fecha" placeholder="Introduce la fecha" />
				<small class="form-text">El campo de la fecha</small>
			</div>
			<div class="form-group">
				<label for="idejemplar">Id Ejemplar:</label> <input type="number"
					id="idejemplar" class="form-control" name="idejemplar"
					placeholder="Introduce el Id Ejemplar" /> <small class="form-text">El
					campo del Id Ejemplar</small>
			</div>
			<div class="form-group">
				<label for="idcopia">Id Copia:</label> <input type="number"
					id="idcopia" class="form-control" name="idcopia"
					placeholder="Introduce el Id Copia" /> <small class="form-text">El
					campo del Id Copia</small>
			</div>
			<input type="hidden" name="comando" value="salvarprestamo" /> <input
				type="submit" class="btn btn-primary" value="Salvar" />
		</div>
	</form>



</body>
</html>
