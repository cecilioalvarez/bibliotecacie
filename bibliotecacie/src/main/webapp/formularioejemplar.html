<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Insert title here</title>

<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
	rel="stylesheet"
	integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
	crossorigin="anonymous">

</head>
<body>
 
 <div class="container">
	<h1>Bienvenido a la biblioteca</h1>
	</div>
	
 <div class="container">
	<h2>Introduce ejemplar</h2>
	</div>
	<script
		src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
		integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
		crossorigin="anonymous"></script>

	<form action="">

		<div class="container">
			<div class="form-group">
				<label for="id"> Id: </label> <input type="text" id="id"
					class="form-control" name="id" placeholder="introduce el ID" />
				
				 
				<label for="isbn"> ISBN: </label> <input type="text" id="isbn"
					class="form-control" name="isbn" placeholder="introduce el ISBN" />
			</div>

			<div class="form-group">
				<label for="titulo">Titulo:</label> <input type="text" id="titulo"
					class="form-control" name="titulo"
					placeholder="introduce el titulo" /> <small class="form-text">
					(Tiulo del Libro)</small>
			</div>


			<div class="form-group">
				<label for="autor">Autor:</label> <input type="text"
					id="autor" class="form-control" name="autor"
					placeholder="introduce el autor" /> <small class="form-text">
					(Autor del libro)</small>
			</div>
			<input type="hidden" name="comando" value="salvarejemplar"/>
			<input type="submit" class="btn btn-secondary" name="Guardar" />
		</div>

	</form>


</body>
</html>
